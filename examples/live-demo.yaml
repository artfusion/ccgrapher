# examples/live-demo.yaml
# The fixture for `ccg run`. It executes end to end with no API key and no
# network: examples/live-demo.impl.mjs implements every node with a sleep.
#
# Deliberately not a happy path. `fetch_code` always fails, so `count_lines` is
# skipped for want of an input, while the other branch carries on to a human
# gate. That is the shape worth demonstrating: a run where one thing broke and
# the rest of the graph kept its head.
#
# `fetch_docs` also declares a capability it depends on. The impl module reports
# that capability as available and calls `context.capability(...)` when it uses
# it, so the trace carries both halves: what was claimed and what was actually
# reached.
#
#   ccg run examples/live-demo.yaml --impl examples/live-demo.impl.mjs
#   ccg run examples/live-demo.yaml --impl examples/live-demo.impl.mjs --serve
#
# Lints clean: every edge carries a real field, no verifier grades its own work,
# and no two concurrent nodes write the same file.
version: 1
name: live-demo
goal: "summarise a change: two parallel readers, one that fails, and a human gate"

nodes:
  - id: plan
    label: plan the work
    kind: split
    model: cheap
    in:  { topic: string }
    out: { docs_url: url, code_path: string }

  - id: fetch_docs
    label: read the docs
    kind: worker
    model: cheap
    uses: ["mcp:docs/fetch"]    # a claim the trace can be held against
    in:  { docs_url: url }
    out: { notes: markdown }

  - id: fetch_code
    label: read the source
    kind: worker
    model: cheap
    in:  { code_path: string }
    out: { symbols: "string[]" }

  - id: count_lines
    label: count what changed
    kind: worker
    model: null                 # plain code, no model, no tokens
    in:  { symbols: "string[]" }
    out: { total: number }

  - id: summarise
    label: write the summary
    kind: synthesize
    model: strong
    in:  { notes: markdown }
    out: { summary: markdown }

  - id: review
    label: a human reads it
    kind: gate                  # no implementation: a gate is answered, not run
    in:  { summary: markdown }
    out: { summary: markdown }

  - id: publish
    label: publish the summary
    kind: worker
    model: null
    in:  { summary: markdown }
    out: { path: string }
    writes: ["out/live-demo.md"]

edges:
  - { from: plan,       to: fetch_docs,  carries: [docs_url] }
  - { from: plan,       to: fetch_code,  carries: [code_path] }
  - { from: fetch_docs, to: summarise,   carries: [notes] }
  - { from: fetch_code, to: count_lines, carries: [symbols] }
  - { from: summarise,  to: review,      carries: [summary] }
  - { from: review,     to: publish,     carries: [summary] }
