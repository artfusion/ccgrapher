# examples/daily-brief.yaml
# A scheduled agent that posts one brief a day. A schedule wakes it; it reads the
# preferences a person keeps and the state it keeps for itself, reads its sources
# from where it left off, picks what matters, re-checks each pick, looks at the
# destination for today's post, posts once, and only then moves its place-markers
# forward. A person reads the brief and edits the preferences for tomorrow.
#
# The dataflow alone lints clean, and so would the three ways this workflow goes
# wrong across runs: posting twice, moving the markers before posting, and the
# agent writing the preferences. Those live in what one run hands the next, so
# the spec says it: a schedule, stores that outlive a run, and the one effect
# that cannot be taken back. With those declared it still lints clean, and each
# of the three mistakes is a finding (DUPLICATE_EFFECT, EARLY_COMMIT and
# AUTHORITY_BREACH).
version: 1
name: daily-brief
goal: "one brief a day, posted once, remembering what it already reported"

# Opaque, one line. Any schedule means any run can be fired again.
schedule: "0 7 * * *"

# State that outlives a run. A gate is the only human actor, so a store a person
# owns may be written by a gate and nothing else. `records` marks progress
# state: it may only be written once that effect has happened.
stores:
  preferences: { owner: human }
  bookmarks:   { owner: agent, records: "post:brief-channel" }
  ledger:      { owner: agent, records: "post:brief-channel" }

nodes:
  # The schedule. A root, so `tick` is an invocation parameter, not an edge.
  - id: wake
    label: wake on schedule
    kind: split
    model: null
    in:  { tick: "YYYY-MM-DDTHH:MM" }
    out: { run_date: "YYYY-MM-DD" }

  # Owned by a person. The agent reads it and nothing here writes it.
  - id: load_prefs
    label: read the preferences
    kind: worker
    model: null
    in:  { run_date: "YYYY-MM-DD" }
    out: { preferences: object }

  # Owned by the agent: a bookmark per source and a ledger of what it reported.
  - id: load_state
    label: read bookmarks and ledger
    kind: worker
    model: null
    in:  { run_date: "YYYY-MM-DD" }
    out: { bookmarks: object, ledger: object }

  # Reading the destination is not the effect. It is the check on the effect,
  # and declaring it as the guard is what makes the post at-most-once.
  - id: check_destination
    label: is today's post already up?
    kind: worker
    model: null
    uses: ["mcp:channel/read"]
    guards: ["post:brief-channel"]
    in:  { run_date: "YYYY-MM-DD" }
    out: { already_posted: boolean }

  - id: read_sources
    label: read the sources from their bookmarks
    kind: worker
    model: cheap
    uses: ["mcp:feed/read"]
    in:  { bookmarks: object }
    out: { items: "object[]", next_bookmarks: object }

  - id: decide
    label: decide what matters
    kind: synthesize
    model: strong
    expects: 3
    in:  { items: "object[]", preferences: object, ledger: object }
    out: { shortlist: "object[]" }

  # Right before posting, not when it was first read: a source changes.
  - id: recheck
    label: re-check the picks
    kind: verifier
    model: cheap
    freshContext: true
    uses: ["mcp:feed/read"]
    in:  { shortlist: "object[]" }
    out: { confirmed: "object[]" }

  - id: compose
    label: write the brief
    kind: synthesize
    model: strong
    expects: 2
    in:  { confirmed: "object[]", preferences: object }
    out: { brief: markdown }

  # The external effect. Once sent it stays sent.
  - id: post
    label: post the brief
    kind: worker
    model: null
    expects: 2
    uses: ["mcp:channel/post"]
    effects: ["post:brief-channel"]
    in:  { brief: markdown, already_posted: boolean }
    out: { post_id: string }

  # Moves the place-markers forward, and only once `post` has happened: the
  # receipt it takes from `post` is what makes that ordering a real edge.
  - id: commit_state
    label: advance bookmarks and ledger
    kind: reduce
    model: null
    expects: 3
    writes: [bookmarks, ledger]
    in:  { next_bookmarks: object, confirmed: "object[]", post_id: string }
    out: { committed: boolean }

  # A person reads the brief, then edits the preferences. The edit lands in a
  # store `load_prefs` reads next time, a loop across runs that a graph of one
  # run cannot draw, so there is no arrow for it.
  - id: review
    label: a person reads it and edits preferences
    kind: gate
    writes: [preferences]
    in:  { post_id: string }
    out: { edited_preferences: markdown }

edges:
  - { from: wake,              to: load_prefs,        carries: [run_date] }
  - { from: wake,              to: load_state,        carries: [run_date] }
  - { from: wake,              to: check_destination, carries: [run_date] }
  - { from: load_state,        to: read_sources,      carries: [bookmarks] }
  - { from: read_sources,      to: decide,            carries: [items] }
  - { from: load_prefs,        to: decide,            carries: [preferences] }
  - { from: load_state,        to: decide,            carries: [ledger] }
  - { from: decide,            to: recheck,           carries: [shortlist] }
  - { from: recheck,           to: compose,           carries: [confirmed] }
  - { from: load_prefs,        to: compose,           carries: [preferences] }
  - { from: compose,           to: post,              carries: [brief] }
  - { from: check_destination, to: post,              carries: [already_posted] }
  - { from: read_sources,      to: commit_state,      carries: [next_bookmarks] }
  - { from: recheck,           to: commit_state,      carries: [confirmed] }
  - { from: post,              to: commit_state,      carries: [post_id] }
  - { from: post,              to: review,            carries: [post_id] }
