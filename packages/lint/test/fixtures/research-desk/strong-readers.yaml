# research-desk with the readers moved to the strong tier.
# Expected: TIER_MISMATCH on research, and MONOCULTURE on each skeptic, which
# now checks a strong reader on the strong tier. Nothing else.
version: 1
name: research-desk
goal: "decision-grade research on <question>"

# One claim about six steps, said once. Drawn as a dashed region around them;
# it moves no node, and only `report` below it writes anything.
boundaries:
  - id: gather
    label: gather and check
    members: [research, dedupe, skeptic_correct, skeptic_current, skeptic_source, vote]
    access: read-only

nodes:
  - id: plan
    label: plan the angles
    kind: split
    model: strong
    in:  { question: string }
    out: { angle: string }

  - id: research
    label: researcher
    kind: worker
    model: strong
    fanOut: { over: angle, cap: 5 }     # renders as one stacked node badged x5
    in:  { angle: string }
    out: { claim: string, source: url, date: "YYYY-MM-DD" }

  - id: dedupe
    label: dedupe by source
    kind: reduce
    model: null                          # plain code. no model, no tokens.
    expects: 5
    in:  { claim: string, source: url, date: "YYYY-MM-DD" }
    out: { finding: object }

  - id: skeptic_correct
    label: is it correct?
    kind: verifier
    model: strong
    freshContext: true
    in:  { finding: object }
    out: { vote: "keep|drop", why: string }

  - id: skeptic_current
    label: is it current?
    kind: verifier
    model: strong
    freshContext: true
    in:  { finding: object }
    out: { vote: "keep|drop", why: string }

  - id: skeptic_source
    label: is the source real?
    kind: verifier
    model: strong
    freshContext: true
    in:  { finding: object }
    out: { vote: "keep|drop", why: string }

  - id: vote
    label: majority survives
    kind: reduce
    model: null
    expects: 4                           # the finding, and a vote on it from each skeptic
    in:  { finding: object, vote: "keep|drop" }
    out: { survivor: object }

  - id: report
    label: one ranked report
    kind: synthesize
    model: strong
    in:  { survivor: object }
    out: { report: markdown }
    writes: ["research-report.md"]

  - id: gate
    label: human approves
    kind: gate
    in:  { report: markdown }
    out: { approved: boolean }

edges:
  - { from: plan,   to: research, carries: [angle] }
  - { from: research, to: dedupe, carries: [claim, source, date] }
  - { from: dedupe, to: skeptic_correct, carries: [finding] }
  - { from: dedupe, to: skeptic_current, carries: [finding] }
  - { from: dedupe, to: skeptic_source,  carries: [finding] }
  - { from: dedupe, to: vote,            carries: [finding] }   # the votes say keep or drop; this is what survives
  - { from: skeptic_correct, to: vote, carries: [vote] }
  - { from: skeptic_current, to: vote, carries: [vote] }
  - { from: skeptic_source,  to: vote, carries: [vote] }
  - { from: vote,   to: report, carries: [survivor] }
  - { from: report, to: gate,   carries: [report] }
