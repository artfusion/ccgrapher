name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor we claim in engines; 24 is current.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Build the web canvas
        run: pnpm --filter @ccgrapher/web build

      - name: Acceptance criteria
        run: |
          set -euo pipefail

          # #2 — the broken fixture lints to the documented findings, and the
          # critical path collapses. Exit code 1 is expected here.
          node apps/cli/dist/index.js lint examples/linear-chain.yaml > lint.txt && rc=0 || rc=$?
          test "$rc" -eq 1
          grep -q "Critical path: 6 layers -> 4 layers" lint.txt
          test "$(grep -c 'FAKE_EDGE' lint.txt)" -eq 2

          # The clean fixtures stay clean.
          node apps/cli/dist/index.js lint \
            examples/diamond.yaml \
            examples/research-desk.yaml \
            examples/route-auth-audit.yaml

          # #1 — diamond renders four layers with five workers on one row.
          node apps/cli/dist/index.js render examples/diamond.yaml -o diamond.svg
          test "$(grep -o 'data-rank="1"' diamond.svg | wc -l)" -eq 5

          # The embedded font carries its OFL notice; --no-embed-font does not.
          grep -q "SIL Open Font" diamond.svg
          node apps/cli/dist/index.js render examples/diamond.yaml --no-embed-font -o plain.svg
          ! grep -q "SIL Open Font" plain.svg

          # The capability audit, end to end. A run that declares, reports and
          # uses the same capability is clean.
          node apps/cli/dist/index.js trace audit examples/traces/live-demo.jsonl \
            --spec examples/live-demo.yaml > audit-clean.txt
          grep -q "no findings" audit-clean.txt

          # A capability reported lost before its node ran is an error, exit 1.
          node apps/cli/dist/index.js trace audit examples/traces/capability-gap.jsonl \
            --spec examples/capability-audit.yaml > audit-gap.txt && rc=0 || rc=$?
          test "$rc" -eq 1
          grep -q "CAPABILITY_GAP" audit-gap.txt

          # Silence is never absence. Strip every capability event and the same
          # pairing must report nothing and say that nothing was checked.
          grep -v '"type":"capability_' examples/traces/live-demo.jsonl > silent.jsonl
          node apps/cli/dist/index.js trace audit silent.jsonl --spec examples/live-demo.yaml > audit-silent.txt
          grep -q "no findings" audit-silent.txt
          grep -q "no capability events" audit-silent.txt

          # A trace and a spec that have nothing to do with each other is bad
          # usage, not a report. Exit 2, and no findings invented.
          node apps/cli/dist/index.js trace audit examples/traces/live-demo.jsonl \
            --spec examples/capability-audit.yaml > audit-wrong.txt 2> audit-wrong-err.txt && rc=0 || rc=$?
          test "$rc" -eq 2
          grep -q "none came from" audit-wrong-err.txt

          # A directory holding runs from several specs audits only its own.
          node apps/cli/dist/index.js trace audit examples/traces \
            --spec examples/capability-audit.yaml > audit-pool.txt && rc=0 || rc=$?
          test "$rc" -eq 1
          grep -q "Skipped 1 run" audit-pool.txt
          ! grep -q "mcp:docs/fetch" audit-pool.txt

          # Every source file is licence-tagged.
          untagged=$(grep -rL "SPDX-License-Identifier" \
            --include="*.ts" --include="*.tsx" packages apps \
            | grep -v "/dist/" | grep -v "next-env" | grep -v "/.next/" || true)
          test -z "$untagged" || { echo "missing SPDX: $untagged"; exit 1; }
