# The dual-track vision rollout, written the way the tool says plans should be
# written: tickets as nodes, honest in/out, gates where a human holds the key.
# Ticket IDs are backfilled into labels once the Linear issues exist.
version: 1
name: vision-rollout
goal: "ship the dual-track vision: OSS live-execution stack + the ccgrapher Cloud seed"

nodes:
  - id: frontdoor
    label: "E1 front door: VISION.md, discipline, ticket briefs"
    kind: split
    model: strong
    out: { briefs: table, vision: markdown }
    writes: [VISION.md, CLAUDE.md, plans/vision-rollout.yaml]

  # ── wave 1 ──────────────────────────────────────────────
  - id: t1_trace
    label: "T1 @ccgrapher/trace: event contract + reducer"
    kind: worker
    model: strong
    in: { briefs: table }
    out: { trace_contract: package }
    writes: [packages/trace/]

  - id: art159_ingest
    label: "ART-159 ingest: edges from dataflow, not names"
    kind: worker
    model: strong
    in: { briefs: table }
    out: { dataflow_edges: feature }
    writes: [packages/ingest/src/ingest.ts]

  - id: art161_publish
    label: "ART-161 publish 0.3.0 (Michael: npm auth)"
    kind: gate
    in: { briefs: table }
    out: { npm_030: release }

  - id: s3_readme
    label: "S3 README hero: correctness over speed"
    kind: worker
    model: strong
    in: { vision: markdown }
    out: { readme_hero: markdown }
    writes: [README.md]

  - id: c2_dns
    label: "C2 ccgrapher.artfusion.com DNS (Michael)"
    kind: gate
    in: { briefs: table }
    out: { subdomain: dns }

  - id: c4_retro_tl
    label: "C4 retro on timelanes: second demo artifact"
    kind: worker
    model: cheap
    in: { briefs: table }
    out: { retro_demo: artifact }

  - id: c1_landing
    label: "C1 landing page draft (apps/site)"
    kind: worker
    model: strong
    in: { vision: markdown }
    out: { landing_draft: html }
    writes: [apps/site/]

  # ── wave 2 ──────────────────────────────────────────────
  - id: t2_runner
    label: "T2 @ccgrapher/runner: execute() engine"
    kind: worker
    model: strong
    in: { trace_contract: package }
    out: { runner_engine: package }
    writes: [packages/runner/]

  - id: t4_server
    label: "T4 ccg serve: SSE replay/follow + gate POST"
    kind: worker
    model: strong
    in: { trace_contract: package }
    out: { sse_endpoints: api }
    writes: [apps/cli/src/serve.ts]

  - id: t8_markers
    label: "T8 claude-code target: ccg trace markers + gate warning"
    kind: worker
    model: strong
    in: { trace_contract: package }
    out: { marked_workflows: codegen }
    writes: [packages/codegen/src/targets/claude-code.ts]

  - id: t10_stats
    label: "T10 heat/stats producers: retro --heat, ccg trace stats"
    kind: worker
    model: cheap
    in: { trace_contract: package }
    out: { heat_data: json, run_stats: json }
    writes: [apps/cli/src/commands/retro.ts, apps/cli/src/commands/trace-stats.ts]

  - id: c5_landing_live
    label: "C5 landing live on the subdomain"
    kind: worker
    model: cheap
    in: { landing_draft: html, subdomain: dns }
    expects: 2
    out: { landing_live: url }

  # ── wave 3 ──────────────────────────────────────────────
  - id: t3_run
    label: "T3 ccg run: execute a spec with trace emission"
    kind: worker
    model: strong
    in: { trace_contract: package, runner_engine: package }
    expects: 2
    out: { run_cmd: cli, sample_trace: jsonl }
    writes: [apps/cli/src/commands/run.ts, examples/live-demo.yaml]

  - id: t9_watch
    label: "T9 ccg watch: Claude Code journal -> trace (spike first)"
    kind: worker
    model: strong
    in: { trace_contract: package, marked_workflows: codegen }
    expects: 2
    out: { watch_cmd: cli, journal_fixtures: jsonl }
    writes: [apps/cli/src/commands/watch.ts]

  - id: cloud_mvp
    label: "E4 hosted control plane: runner behind a queue (capture)"
    kind: worker
    model: strong
    in: { trace_contract: package, runner_engine: package }
    expects: 2
    out: { hosted_mvp: service }

  - id: c3_audit
    label: "C3 paid workflow audit v1, offer live"
    kind: worker
    model: strong
    in: { landing_live: url, retro_demo: artifact }
    expects: 2
    out: { audit_case: artifact }

  # ── wave 4 ──────────────────────────────────────────────
  - id: t5_live
    label: "T5 canvas live overlay: connect, seam, status"
    kind: worker
    model: strong
    in: { trace_contract: package, sse_endpoints: api, sample_trace: jsonl }
    expects: 3
    out: { overlay_seam: api, live_ui: feature }
    writes: [apps/web/lib/run-state.ts, apps/web/app/editor.tsx, apps/web/app/spec-node.tsx]

  - id: t13_worktrees
    label: "T13 runner worktree isolation at runtime"
    kind: worker
    model: strong
    in: { runner_engine: package, run_cmd: cli }
    expects: 2
    out: { isolation: feature }
    writes: [packages/runner/src/worktree.ts]

  # ── wave 5 ──────────────────────────────────────────────
  - id: t6_popover
    label: "T6 node pop-over: status, tail, usage"
    kind: worker
    model: strong
    in: { overlay_seam: api }
    out: { popover: feature }
    writes: [apps/web/app/spec-node.tsx]
    worktree: true

  - id: t7_gate_ui
    label: "T7 gate approve/reject in the canvas"
    kind: worker
    model: strong
    in: { overlay_seam: api, sse_endpoints: api }
    expects: 2
    out: { gate_ui: feature }
    writes: [apps/web/app/spec-node.tsx]
    worktree: true

  - id: t11_heatmap
    label: "T11 heatmap overlay: retro + trace thermal tint"
    kind: worker
    model: strong
    in: { overlay_seam: api, heat_data: json }
    expects: 2
    out: { heatmap_ui: feature }
    writes: [apps/web/app/editor.tsx]
    worktree: true

  - id: t12_pareto
    label: "T12 Pareto simulator: tier swaps, honest projections"
    kind: worker
    model: strong
    in: { overlay_seam: api, run_stats: json }
    expects: 2
    out: { pareto_ui: feature }
    writes: [apps/web/app/editor.tsx, packages/trace/src/estimate.ts]
    worktree: true

  # ── wave 6+ ─────────────────────────────────────────────
  - id: t14_docs
    label: "T14 front-door docs: README, docs/trace.md, CHANGELOG"
    kind: synthesize
    model: strong
    in:
      run_cmd: cli
      sse_endpoints: api
      live_ui: feature
      popover: feature
      gate_ui: feature
      watch_cmd: cli
      heatmap_ui: feature
      pareto_ui: feature
      isolation: feature
    expects: 9
    out: { frontdoor_docs: markdown }
    writes: [README.md, docs/trace.md, CHANGELOG.md]

  - id: publish_040
    label: "0.4.0 publish train (Michael or CI via ART-157)"
    kind: gate
    in: { frontdoor_docs: markdown, npm_030: release }
    expects: 2
    out: { npm_040: release }

edges:
  - { from: frontdoor, to: t1_trace, carries: [briefs] }
  - { from: frontdoor, to: art159_ingest, carries: [briefs] }
  - { from: frontdoor, to: art161_publish, carries: [briefs] }
  - { from: frontdoor, to: s3_readme, carries: [vision] }
  - { from: frontdoor, to: c2_dns, carries: [briefs] }
  - { from: frontdoor, to: c4_retro_tl, carries: [briefs] }
  - { from: frontdoor, to: c1_landing, carries: [vision] }

  - { from: t1_trace, to: t2_runner, carries: [trace_contract] }
  - { from: t1_trace, to: t4_server, carries: [trace_contract] }
  - { from: t1_trace, to: t8_markers, carries: [trace_contract] }
  - { from: t1_trace, to: t10_stats, carries: [trace_contract] }
  - { from: t1_trace, to: t3_run, carries: [trace_contract] }
  - { from: t1_trace, to: t9_watch, carries: [trace_contract] }
  - { from: t1_trace, to: t5_live, carries: [trace_contract] }
  - { from: t1_trace, to: cloud_mvp, carries: [trace_contract] }

  - { from: t2_runner, to: t3_run, carries: [runner_engine] }
  - { from: t2_runner, to: t13_worktrees, carries: [runner_engine] }
  - { from: t2_runner, to: cloud_mvp, carries: [runner_engine] }

  - { from: t8_markers, to: t9_watch, carries: [marked_workflows] }

  - { from: t4_server, to: t5_live, carries: [sse_endpoints] }
  - { from: t4_server, to: t7_gate_ui, carries: [sse_endpoints] }
  - { from: t4_server, to: t14_docs, carries: [sse_endpoints] }

  - { from: t3_run, to: t5_live, carries: [sample_trace] }
  - { from: t3_run, to: t13_worktrees, carries: [run_cmd] }
  - { from: t3_run, to: t14_docs, carries: [run_cmd] }

  - { from: t10_stats, to: t11_heatmap, carries: [heat_data] }
  - { from: t10_stats, to: t12_pareto, carries: [run_stats] }

  - { from: c1_landing, to: c5_landing_live, carries: [landing_draft] }
  - { from: c2_dns, to: c5_landing_live, carries: [subdomain] }
  - { from: c5_landing_live, to: c3_audit, carries: [landing_live] }
  - { from: c4_retro_tl, to: c3_audit, carries: [retro_demo] }

  - { from: t5_live, to: t6_popover, carries: [overlay_seam] }
  - { from: t5_live, to: t7_gate_ui, carries: [overlay_seam] }
  - { from: t5_live, to: t11_heatmap, carries: [overlay_seam] }
  - { from: t5_live, to: t12_pareto, carries: [overlay_seam] }
  - { from: t5_live, to: t14_docs, carries: [live_ui] }

  - { from: t6_popover, to: t14_docs, carries: [popover] }
  - { from: t7_gate_ui, to: t14_docs, carries: [gate_ui] }
  - { from: t9_watch, to: t14_docs, carries: [watch_cmd] }
  - { from: t11_heatmap, to: t14_docs, carries: [heatmap_ui] }
  - { from: t12_pareto, to: t14_docs, carries: [pareto_ui] }
  - { from: t13_worktrees, to: t14_docs, carries: [isolation] }

  - { from: t14_docs, to: publish_040, carries: [frontdoor_docs] }
  - { from: art161_publish, to: publish_040, carries: [npm_030] }
